name: Build WebView APK

on:
  push:
    tags: ['v*']  # 只有打 tag 时才触发构建
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，包括所有 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '18'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: Install dependencies
        run: npm ci

      # 发布前安全体检：仓库是 PUBLIC，任何被跟踪文件里的内网地址 / 口令明文 /
      # 新增密钥文件都会随 tag 一起公开，且事后无法从历史中撤回 —— 这里让它直接构建失败。
      # 已知安全债（ci.keystore 与其明文口令）在 KNOWN_EXCEPTIONS 中登记，会打印但不阻断。
      - name: Security preflight
        run: |
          node scripts/check-secrets.mjs --self-test   # 先验证规则本身有效（规则写错会静默全绿）
          node scripts/check-secrets.mjs

      # 回归测试：
      #  - 流终止语义（曾用 done 判断流结束，导致问答永远收不到回答）
      #  - 引用标记解析（<kb …/> 曾是未知标签，引用既不显示也点不开）
      #  - markdown URL 白名单（内部存储协议 local:// 被默认清洗置空 → 图片不显示）
      - name: Regression tests
        run: |
          node scripts/test-stream-protocol.mjs
          node scripts/test-citation-markers.mjs
          # 锁定「知识库设置保存请求体形状」：配置必须嵌套在 config 下，
          # 模型字段走独立端点 —— 顶层平铺会被后端静默忽略（曾导致假成功）
          node scripts/test-kb-settings-payload.mjs
          # 锁定 markdown 渲染放行 local:// / resource:// 等内部协议，
          # 同时保证 javascript: / data: 等危险协议仍被拦
          node scripts/test-markdown-url.mjs
          # 锁定检查更新的判定规则：版本逐段数值比较、无 APK 资产不得提示更新、
          # 草稿/预发布不作为更新目标
          node scripts/test-update-check.mjs

      - name: Build web assets
        run: |
          rm -rf dist-webview node_modules/.vite
          npx vite build --config vite.config.webview.js

      - name: Copy assets to Android project
        run: |
          rm -rf webview-app/app/src/main/assets/web
          mkdir -p webview-app/app/src/main/assets/web
          cp -r dist-webview/* webview-app/app/src/main/assets/web/
          mv webview-app/app/src/main/assets/web/index-webview.html webview-app/app/src/main/assets/web/index.html

      - name: Verify keystore exists
        run: |
          ls -la android-ci/ci.keystore

      - name: Grant Gradle permission
        run: chmod +x webview-app/gradlew

      - name: Build APK with Gradle
        working-directory: ./webview-app
        run: ./gradlew clean assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK
        run: |
          ls -la webview-app/app/build/outputs/apk/release/
          ${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt2 dump badging webview-app/app/build/outputs/apk/release/app-release.apk | grep -E 'version|package'

      - name: Rename APK
        run: |
          cp webview-app/app/build/outputs/apk/release/app-release.apk webview-app/app/build/outputs/apk/release/weknora-mobile-webview.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weknora-mobile-apk-${{ github.run_number }}
          path: webview-app/app/build/outputs/apk/release/weknora-mobile-webview.apk

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-body.md
            echo "Using RELEASE_NOTES.md for release body"
          else
            PREV_TAG=$(git tag --sort=-creatordate | sed -n 2p)
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" > release-body.md
            else
              echo "Release ${{ github.ref_name }}" > release-body.md
            fi
            echo "RELEASE_NOTES.md not found, used fallback"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "WeKnora Mobile ${{ github.ref_name }}"
          files: webview-app/app/build/outputs/apk/release/weknora-mobile-webview.apk
          body_path: release-body.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
